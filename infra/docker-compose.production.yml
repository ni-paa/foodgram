volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13
    env_file: ./.env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: katomy/foodgram_backend
    env_file: ./.env
    command: python manage.py runserver 0.0.0.0:8080
    depends_on:
      - db
    volumes:
      - static:/app/static
      - media:/app/media
      - ../backend:/app
      - ../data/:/app/static/data/

  frontend:
    image: katomy/foodgram_frontend
    volumes:
      - static:/static

  nginx:
    image: nginx:1.25
    ports:
      - 8080:80
    depends_on:
      - backend
      - frontend
    volumes:
      - static:/usr/share/nginx/html/
      - media:/usr/share/nginx/html/media
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ../frontend/build:/usr/share/nginx/html/
      - ../docs/:/usr/share/nginx/html/api/docs/
